name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tsnet:
    name: Build Embedded Tailscale AAR (Go/gomobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/tsnet-bridge/go.mod
          cache-dependency-path: tools/tsnet-bridge/go.sum

      - name: Build tsnet.aar via gomobile
        run: |
          sed -i 's/\r$//' tools/tsnet-bridge/build-aar.sh
          chmod +x tools/tsnet-bridge/build-aar.sh
          ./tools/tsnet-bridge/build-aar.sh

      - name: Upload tsnet.aar artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsnet-aar
          path: tools/tsnet-bridge/tsnet.aar
          if-no-files-found: error

  build:
    name: Build Server, Windows & Android Packages
    needs: build-tsnet
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download embedded tsnet.aar
        uses: actions/download-artifact@v4
        with:
          name: tsnet-aar
          path: src/RadioApp.Maui/Platforms/Android/libs

      - name: Verify tsnet.aar present
        run: |
          if (-not (Test-Path "src/RadioApp.Maui/Platforms/Android/libs/tsnet.aar")) {
            throw "tsnet.aar missing after artifact download"
          }
          Get-Item "src/RadioApp.Maui/Platforms/Android/libs/tsnet.aar" | Format-List FullName, Length

      - name: Setup Java 17 (for Android SDK & APK signing)
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "17"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install .NET 10 MAUI workloads (Windows + Android)
        run: dotnet workload install maui-windows maui-android

      - name: Run unit tests
        run: dotnet test tests/RadioApp.Tests/RadioApp.Tests.csproj -c Release --nologo

      - name: Publish RadioApp.Server (win-x64)
        run: |
          dotnet publish src/RadioApp.Server/RadioApp.Server.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o artifacts/server
          if ($LASTEXITCODE -ne 0) { throw "RadioApp.Server publish failed" }

          New-Item -ItemType Directory -Force artifacts/dist | Out-Null
          Compress-Archive -Path "artifacts/server/*" `
            -DestinationPath "artifacts/dist/RadioWork-Server-win-x64.zip" `
            -CompressionLevel Optimal -Force

      - name: Publish RadioApp.Maui (Windows x64 Unpackaged)
        run: |
          dotnet publish src/RadioApp.Maui/RadioApp.Maui.csproj `
            -p:OnlyTarget=net10.0-windows10.0.19041.0 `
            -f net10.0-windows10.0.19041.0 `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -o artifacts/windows
          if ($LASTEXITCODE -ne 0) { throw "RadioApp.Maui Windows publish failed" }

          Compress-Archive -Path "artifacts/windows/*" `
            -DestinationPath "artifacts/dist/RadioWork-Windows-x64.zip" `
            -CompressionLevel Optimal -Force

      - name: Publish RadioApp.Maui (Android Signed APK + Embedded Tailscale)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $ksPath = Join-Path $PWD "artifacts/radiowork-ci.keystore"
          if (-not [string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64) -and -not [string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_PASS)) {
            [IO.File]::WriteAllBytes($ksPath, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64.Trim()))
            $ksPass = $env:ANDROID_KEYSTORE_PASS.Trim()
          } else {
            $ksPass = "radiowork123"
            keytool -genkeypair -v `
              -keystore $ksPath `
              -alias radiowork `
              -keyalg RSA `
              -keysize 2048 `
              -validity 10000 `
              -storepass $ksPass `
              -keypass $ksPass `
              -dname "CN=RadioWork FM, OU=Audio, O=RadioWork, L=Local, S=Local, C=US"
            if ($LASTEXITCODE -ne 0) { throw "keytool failed" }
          }

          dotnet publish src/RadioApp.Maui/RadioApp.Maui.csproj `
            -p:OnlyTarget=net10.0-android `
            -p:RequireTsnetAar=true `
            -f net10.0-android `
            -c Release `
            -p:AndroidPackageFormat=apk `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="$ksPath" `
            -p:AndroidSigningKeyAlias=radiowork `
            -p:AndroidSigningKeyPass="$ksPass" `
            -p:AndroidSigningStorePass="$ksPass" `
            -o artifacts/android
          if ($LASTEXITCODE -ne 0) { throw "RadioApp.Maui Android publish failed" }

          $apk = Get-ChildItem "artifacts/android/*-Signed.apk" | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem "artifacts/android/*.apk" | Select-Object -First 1 }
          if (-not $apk) { throw "Built Android APK not found" }

          Copy-Item $apk.FullName "artifacts/dist/RadioWork-Android.apk" -Force

      - name: Generate SHA-256 checksums
        run: |
          Get-ChildItem artifacts/dist -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -LiteralPath "$($_.FullName).sha256" -Encoding ascii
            Write-Host "$hash  $($_.Name)"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RadioWork-Packages
          path: artifacts/dist/*
          if-no-files-found: error

      - name: Create GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem artifacts/dist -File | Select-Object -ExpandProperty FullName)
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --verify-tag --title "RadioWork FM $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
