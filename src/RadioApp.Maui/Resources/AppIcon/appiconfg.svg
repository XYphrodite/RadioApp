<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vinylBody" x1="120" y1="120" x2="336" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B2133" />
      <stop offset="48%" stop-color="#0E121D" />
      <stop offset="100%" stop-color="#171C2B" />
    </linearGradient>

    <linearGradient id="vinylRim" x1="112" y1="112" x2="344" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2A85" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#6E56CF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="labelGrad" x1="184" y1="184" x2="272" y2="272" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="55%" stop-color="#C83EFF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="waveLeft" x1="72" y1="140" x2="112" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="100%" stop-color="#FF65A3" />
    </linearGradient>

    <linearGradient id="waveRight" x1="344" y1="140" x2="384" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#38B6FF" />
    </linearGradient>

    <linearGradient id="eqGrad" x1="192" y1="376" x2="264" y2="376" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
  </defs>

  <!-- Soft outer neon wave glow -->
  <path d="M 109.88 313.82 A 146 146 0 0 1 109.88 142.18"
        fill="none" stroke="#FF2A85" stroke-width="24" stroke-linecap="round" stroke-opacity="0.20" />
  <path d="M 72.60 310.63 A 176 176 0 0 1 72.60 145.37"
        fill="none" stroke="#FF2A85" stroke-width="20" stroke-linecap="round" stroke-opacity="0.14" />

  <path d="M 346.12 142.18 A 146 146 0 0 1 346.12 313.82"
        fill="none" stroke="#00F0FF" stroke-width="24" stroke-linecap="round" stroke-opacity="0.20" />
  <path d="M 383.40 145.37 A 176 176 0 0 1 383.40 310.63"
        fill="none" stroke="#00F0FF" stroke-width="20" stroke-linecap="round" stroke-opacity="0.14" />

  <!-- Crisp FM broadcast waves (Left: Nightdrive Pink, Right: Electric Cyan) -->
  <path d="M 109.88 313.82 A 146 146 0 0 1 109.88 142.18"
        fill="none" stroke="url(#waveLeft)" stroke-width="13" stroke-linecap="round" />
  <path d="M 72.60 310.63 A 176 176 0 0 1 72.60 145.37"
        fill="none" stroke="url(#waveLeft)" stroke-width="10.5" stroke-linecap="round" stroke-opacity="0.82" />

  <path d="M 346.12 142.18 A 146 146 0 0 1 346.12 313.82"
        fill="none" stroke="url(#waveRight)" stroke-width="13" stroke-linecap="round" />
  <path d="M 383.40 145.37 A 176 176 0 0 1 383.40 310.63"
        fill="none" stroke="url(#waveRight)" stroke-width="10.5" stroke-linecap="round" stroke-opacity="0.82" />

  <!-- Top FM tuner scale ticks + live needle -->
  <line x1="196" y1="76" x2="196" y2="86" stroke="#A5AEC4" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.45" />
  <line x1="212" y1="74" x2="212" y2="86" stroke="#A5AEC4" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.65" />
  <line x1="228" y1="64" x2="228" y2="88" stroke="#FF2A85" stroke-width="5.5" stroke-linecap="round" />
  <line x1="244" y1="74" x2="244" y2="86" stroke="#A5AEC4" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.65" />
  <line x1="260" y1="76" x2="260" y2="86" stroke="#A5AEC4" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.45" />

  <!-- Central Vinyl Record -->
  <circle cx="228" cy="228" r="116" fill="url(#vinylBody)" stroke="url(#vinylRim)" stroke-width="4.5" />
  <circle cx="228" cy="228" r="98" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.08" />
  <circle cx="228" cy="228" r="80" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.08" />
  <circle cx="228" cy="228" r="63" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.10" />

  <!-- Neon groove reflections -->
  <path d="M 140.99 187.43 A 96 96 0 0 1 203.15 135.27"
        fill="none" stroke="#FF2A85" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.72" />
  <path d="M 159.12 195.88 A 76 76 0 0 1 208.33 154.59"
        fill="none" stroke="#FF2A85" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.48" />

  <path d="M 315.01 268.57 A 96 96 0 0 1 252.85 320.73"
        fill="none" stroke="#00F0FF" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.72" />
  <path d="M 296.88 260.12 A 76 76 0 0 1 247.67 301.41"
        fill="none" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.48" />

  <!-- Glowing Vinyl Center Label -->
  <circle cx="228" cy="228" r="52" fill="#FF2A85" fill-opacity="0.22" />
  <circle cx="228" cy="228" r="45" fill="url(#labelGrad)" />
  <circle cx="228" cy="228" r="35" fill="none" stroke="#07080C" stroke-width="2" stroke-opacity="0.35" />

  <!-- Center Spindle -->
  <circle cx="228" cy="228" r="15" fill="#07080C" />
  <circle cx="228" cy="228" r="5.5" fill="#F3F5FA" />

  <!-- Bottom mini spectrum pulse -->
  <line x1="198" y1="376" x2="198" y2="384" stroke="url(#eqGrad)" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="213" y1="371" x2="213" y2="387" stroke="url(#eqGrad)" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.90" />
  <line x1="228" y1="367" x2="228" y2="390" stroke="url(#eqGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="243" y1="371" x2="243" y2="387" stroke="url(#eqGrad)" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.90" />
  <line x1="258" y1="376" x2="258" y2="384" stroke="url(#eqGrad)" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.75" />
</svg>
